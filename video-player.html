    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Component Loader Logic
        async function loadComponent(id, file) {
            try {
                const res = await fetch(file);
                const text = await res.text();
                document.getElementById(id).innerHTML = text;
                const obs = window.revealObserver || window.observer;
                if (obs) {
                    document.querySelectorAll('#' + id + ' .reveal-up').forEach(el => obs.observe(el));
                }
            } catch (err) {
                console.error('Failed to load component:', file, err);
            }
        }
        // Copy toggle functions from index.html
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobileOverlay');
            overlay.classList.toggle('active');
            document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : 'auto';
        }

        function toggleMobileSearch() {
            const container = document.getElementById('searchContainer');
            if (container) container.classList.toggle('mobile-expanded');
        }

        // Reveal Animations Logic
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal-up');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));

        window.observer = observer;
        window.revealObserver = observer;
        loadComponent('header-placeholder', 'header.html');
        loadComponent('footer-placeholder', 'footer.html');

        window.addEventListener('DOMContentLoaded', () => {
            const getParam = (name) => {
                const urlParams = new URLSearchParams(window.location.search);
                let val = urlParams.get(name);
                if (!val && window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    val = hashParams.get(name);
                }
                return val;
            };

            const videoId = getParam('v');
            const title = getParam('title');
            const date = getParam('date');
            const time = getParam('time');
            const series = getParam('series');

            const iframe = document.getElementById('videoIframe');
            const videoEl = document.getElementById('videoElement');
            const titleEl = document.getElementById('videoTitle');
            const dateEl = document.getElementById('videoDate');
            const timeEl = document.getElementById('videoTime');
            const seriesEl = document.getElementById('seriesTag');
            const loading = document.getElementById('loadingOverlay');
            const container = document.getElementById('videoContainer');
            const notFound = document.getElementById('notFound');

            const hideLoading = () => {
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.style.display = 'none', 500);
                }
            };

            const getDirectStreamUrl = (url) => {
                if (url && url.includes('www.dropbox.com')) {
                    return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
                }
                return url;
            };

            setTimeout(hideLoading, 5000);

            if (videoId) {
                const decodedUrl = decodeURIComponent(videoId);

                // --- DYNAMIC FETCHING FOR ICAITV ---
                if (decodedUrl.includes('icaitv.com')) {
                    (async () => {
                        const proxies = [
                            `https://api.allorigins.win/raw?url=${encodeURIComponent(decodedUrl)}`,
                            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(decodedUrl)}`
                        ];

                        console.log("GTC Player: Starting parallel fetch for speed...");
                        
                        // Race the proxies! Whichever returns a valid result first wins.
                        const fetchPromises = proxies.map(async (proxyUrl) => {
                            const resp = await fetch(proxyUrl);
                            if (!resp.ok) throw new Error("Proxy error");
                            const text = await resp.text();
                            if (!text.includes('dropbox.com')) throw new Error("No stream found");
                            return text;
                        });

                        let html = null;
                        try {
                            html = await Promise.any(fetchPromises);
                        } catch (err) {
                            console.warn("GTC Player: All speed-fetch attempts failed.");
                        }

                        if (html) {
                            const dropboxRegex = /https?:\/\/(?:www\.)?dropbox\.com\/(?:scl\/fi\/|s\/)[^\s"'>]+/g;
                            const matches = html.match(dropboxRegex);
                            
                            if (matches && matches.length > 0) {
                                let directLink = matches[0];
                                directLink = directLink.split('"')[0].split("'")[0].split(">")[0].split("&quot;")[0];
                                if (!directLink.includes('raw=1')) {
                                    directLink += directLink.includes('?') ? '&raw=1' : '?raw=1';
                                }
                                
                                console.log("GTC Player: Stream found! Opening native player.");
                                videoEl.src = getDirectStreamUrl(directLink);
                                videoEl.style.display = 'block';
                                iframe.style.display = 'none';
                                videoEl.onloadeddata = hideLoading;
                                videoEl.onerror = hideLoading;
                                return;
                            }
                        }
                        
                        console.warn("GTC Player: Falling back to website view.");
                        iframe.src = decodedUrl;
                        iframe.style.display = 'block';
                        videoEl.style.display = 'none';
                        iframe.onload = hideLoading;
                        iframe.onerror = hideLoading;
                    })();
                } else if (decodedUrl.toLowerCase().includes('.mp4') || decodedUrl.toLowerCase().includes('dropbox')) {
                    videoEl.src = getDirectStreamUrl(decodedUrl);
                    videoEl.style.display = 'block';
                    iframe.style.display = 'none';
                    videoEl.onloadeddata = hideLoading;
                    videoEl.onerror = hideLoading;
                } else {
                    let embedUrl = decodedUrl;
                    if (!decodedUrl.includes('http')) {
                        embedUrl = `https://www.youtube.com/embed/${decodedUrl}?autoplay=1`;
                    } else if (decodedUrl.includes('youtube.com/watch?v=')) {
                        const id = decodedUrl.split('v=')[1].split('&')[0];
                        embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1`;
                    }
                    iframe.src = embedUrl;
                    iframe.style.display = 'block';
                    videoEl.style.display = 'none';
                    iframe.onload = hideLoading;
                    iframe.onerror = hideLoading;
                }
                if (title) titleEl.innerText = title;
                if (date) dateEl.innerText = date;
                if (time) timeEl.innerText = time;
                if (series) seriesEl.innerText = series;
            } else {
                container.style.display = 'none';
                notFound.style.display = 'block';
                hideLoading();
            }
        });
    </script>
</body>
</html>
