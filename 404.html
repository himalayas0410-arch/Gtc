<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - Global Trade & Services Committee</title>
    <meta name="description" content="The page you are looking for could not be found. Return to the GTC homepage.">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="images/favicon/favicon.ico">
    <link rel="manifest" href="images/favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--blue-primary, #4EA5D9), var(--orange-secondary, #E4572E));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 1.1rem;
            color: #64748b;
            max-width: 500px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: var(--blue-primary, #4EA5D9);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .error-btn:hover {
            background: #1e293b;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        #header-placeholder {
            position: relative;
            z-index: 9999;
        }
    </style>
</head>

<body class="tactile-depth">
    <div id="scrollProgress"></div>

    <!-- Dynamic Header -->
    <div id="header-placeholder"></div>

    <div class="error-container">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-text">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="index.html" class="error-btn">
                <span class="material-symbols-outlined">home</span>
                Back to Home
            </a>
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-placeholder"></div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadComponent(id, file) {
            try {
                const res = await fetch(file);
                const text = await res.text();
                document.getElementById(id).innerHTML = text;
            } catch (err) {
                console.error('Failed to load component:', file, err);
            }
        }

        function toggleMobileMenu() {
            const overlay = document.getElementById('mobileOverlay');
            if (overlay) {
                overlay.classList.toggle('active');
                document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : 'auto';
            }
        }

        function toggleMobileSearch() {
            const container = document.getElementById('searchContainer');
            if (container) container.classList.toggle('mobile-expanded');
        }

        loadComponent('header-placeholder', 'header.html');
        loadComponent('footer-placeholder', 'footer.html');
    </script>
</body>

</html>
